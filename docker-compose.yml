version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker.example
    environment:
      - APP_ENV=${APP_ENV:-production}
      - AEGIS_JWT_SECRET=${AEGIS_JWT_SECRET:?AEGIS_JWT_SECRET is required}
      - AEGIS_BOOTSTRAP_ADMIN_PASSWORD=${AEGIS_BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      - POSTGRES_DSN=${POSTGRES_DSN:-}
      - REDIS_URL=${REDIS_URL:-}
      - AEGIS_DEVICE_PREFERENCE=${AEGIS_DEVICE_PREFERENCE:-auto}
      - AEGIS_OPEN_VOCAB_PROVIDER=${AEGIS_OPEN_VOCAB_PROVIDER:-grounding_dino}
      - AEGIS_OPEN_VOCAB_MODEL_PATH=${AEGIS_OPEN_VOCAB_MODEL_PATH:-}
      - AEGIS_OPEN_VOCAB_PROCESSOR_PATH=${AEGIS_OPEN_VOCAB_PROCESSOR_PATH:-}
      - AEGIS_OPEN_VOCAB_ALLOW_DOWNLOAD=${AEGIS_OPEN_VOCAB_ALLOW_DOWNLOAD:-false}
    volumes:
      - ./models:/app/models
      - ./storage:/app/storage
      - ./backend/output:/app/backend/output
      - ./configs/runtime:/app/configs/runtime
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional: model-cache placeholder for future model artifact service
  # model-cache:
  #   image: minio/minio:latest
  #   ...

volumes:
  postgres_data:
  redis_data:
