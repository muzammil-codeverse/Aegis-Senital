drone_city_missions:
  simulated_geo: true
  home_point:
    latitude: 30.1575
    longitude: 71.5249
    altitude_m: 40
  runtime_compatibility:
    CityEnviron:
      waypoint_scale: city
      preferred: true
    AirSimNH:
      waypoint_scale: neighborhood
      preferred: true
    Blocks:
      waypoint_scale: compact
      fallback_route: true
  presets:
    - name: perimeter_patrol
      description: Simulated perimeter patrol around demo city sectors.
      simulated_geo: true
      camera: front_center
      dwell_seconds: 2
      safe_wording: Simulated aerial observation
      expected_demo_outcome: Candidate perimeter movement pattern for operator review.
      routes:
        city_route:
          - { lat: 30.1583, lon: 71.5239, altitude_m: 52, action: observe }
          - { lat: 30.1590, lon: 71.5250, altitude_m: 52, action: scan }
          - { lat: 30.1578, lon: 71.5262, altitude_m: 52, action: orbit }
          - { lat: 30.1569, lon: 71.5246, altitude_m: 52, action: observe }
        neighborhood_route:
          - { lat: 30.1579, lon: 71.5241, altitude_m: 45, action: observe }
          - { lat: 30.1584, lon: 71.5250, altitude_m: 45, action: scan }
          - { lat: 30.1573, lon: 71.5258, altitude_m: 45, action: orbit }
          - { lat: 30.1569, lon: 71.5247, altitude_m: 45, action: observe }
        compact_route:
          - { lat: 30.1575, lon: 71.5247, altitude_m: 34, action: observe }
          - { lat: 30.1578, lon: 71.5250, altitude_m: 34, action: scan }
          - { lat: 30.1574, lon: 71.5253, altitude_m: 34, action: observe }

    - name: incident_response
      description: Simulated response from launch point toward demo incident marker.
      simulated_geo: true
      camera: front_center
      dwell_seconds: 2
      safe_wording: Operator review required
      expected_demo_outcome: Evidence-backed hypothesis from aerial to ground context handoff.
      routes:
        city_route:
          - { lat: 30.1574, lon: 71.5246, altitude_m: 56, action: observe }
          - { lat: 30.1583, lon: 71.5259, altitude_m: 56, action: scan }
          - { lat: 30.1589, lon: 71.5268, altitude_m: 50, action: handoff }
        neighborhood_route:
          - { lat: 30.1575, lon: 71.5248, altitude_m: 48, action: observe }
          - { lat: 30.1580, lon: 71.5257, altitude_m: 48, action: scan }
          - { lat: 30.1583, lon: 71.5263, altitude_m: 44, action: handoff }
        compact_route:
          - { lat: 30.1575, lon: 71.5248, altitude_m: 34, action: observe }
          - { lat: 30.1578, lon: 71.5252, altitude_m: 34, action: scan }
          - { lat: 30.1579, lon: 71.5254, altitude_m: 34, action: handoff }

    - name: crowd_monitoring
