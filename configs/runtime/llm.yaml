llm:
  enabled: true
  provider: "openai"
  mode: "assistive_only"

  default_provider: "openai"

  providers:
    local_stub:
      enabled: true
      purpose: "offline tests and development fallback only"

    openai:
      enabled: true
      api_key_env: "OPENAI_API_KEY"
      model_env: "OPENAI_LLM_MODEL"
      escalation_model_env: "OPENAI_LLM_ESCALATION_MODEL"
      final_report_model_env: "OPENAI_LLM_FINAL_REPORT_MODEL"

      # Default model for most summaries, evidence explanations, and case Q&A.
      model: "gpt-5.4-mini"

      # Use for complex cases or supervisor-requested deeper reasoning.
      escalation_model: "gpt-5.4"

      # Use only for final polished reports if explicitly requested.
      final_report_model: "gpt-5.5"

      timeout_seconds: 45
      max_retries: 2

      reasoning:
        default_effort: "low"
        escalation_effort: "medium"
        final_report_effort: "medium"

      cost_control:
        max_input_tokens: 120000
        max_output_tokens: 1800
        allow_final_report_model: true
        require_explicit_escalation: true

  safety:
    require_source_grounding: true
    require_operator_review_caveat: true
    prohibit_criminality_claims: true
    prohibit_identity_confirmation: true
    prohibit_unsupported_certainty: true
    block_raw_embeddings: true
    block_secrets: true
    max_input_events: 100
    max_input_evidence_items: 100
    max_notes: 50

  reports:
    default_format: "markdown"
    include_evidence_ids: true
    include_case_ids: true
    include_model_caveats: true
    include_timeline: true
    save_generated_reports: true

  development:
    allow_local_stub_if_openai_key_missing: true

  production:
    fail_if_enabled_provider_missing: true
    fail_if_openai_key_missing: true
