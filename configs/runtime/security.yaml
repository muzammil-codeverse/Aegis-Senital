auth:
  jwt_secret_env: AEGIS_JWT_SECRET
  algorithm: HS256
  access_token_minutes: 480
  require_auth: true
  token_issuer: aegis-sentinel
  token_audience: aegis-operators
  set_auth_cookie: true
  cookie_name: aegis_access_token
  cookie_secure: false
  cookie_samesite: lax
  cookie_httponly: true
  cookie_path: /
  csrf_cookie_name: aegis_csrf_token
  csrf_header_name: X-CSRF-Token
  csrf_protect_cookie_auth: true
  allow_query_token_for_websocket: false
  allow_subprotocol_token_for_websocket: true
  expose_bearer_response: true
  bootstrap_admin_username: admin
  bootstrap_admin_password_env: AEGIS_BOOTSTRAP_ADMIN_PASSWORD
password:
  min_length: 10
  require_uppercase: true
  require_lowercase: true
  require_number: true
  require_symbol: false
  bcrypt_rounds: 12
lockout:
  enabled: true
  max_failed_attempts: 5
  lockout_seconds: 900
rate_limit:
  login_attempts_per_minute: 5
  login_attempts_per_username_per_minute: 5
  cleanup_interval_seconds: 60
audit:
  enabled: true
  storage_dir: storage/audit
  rotate_daily: true
  max_recent_entries: 2000
  hash_chain_enabled: true
privacy:
  mask_identity_display_for_viewer: true
  hide_watchlist_reason_for_operator: true
  allow_raw_enrollment_image_access: false
  audit_forensic_access: true
mfa:
  enabled: false
  required_roles:
    - admin
    - supervisor
rbac:
  admin:
    - "*"
  supervisor:
    - "camera:read"
    - "camera:control"
