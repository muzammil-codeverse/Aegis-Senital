# Aegis Sentinel dependency policy — controls which packages are required per profile.
# Read by scripts/validate_runtime.py --profile <profile>.
#
# Profiles: development (local dev, no postgres/redis required)
#           production  (all core services required; graceful degradation disabled)

profiles:
  development:
    required:
      - module: torch
        label: "PyTorch"
        install_hint: "pip install torch --index-url https://download.pytorch.org/whl/cu124"
      - module: torchvision
        label: "torchvision"
        install_hint: "pip install torchvision --index-url https://download.pytorch.org/whl/cu124"
      - module: ultralytics
        label: "Ultralytics YOLO"
        install_hint: "pip install ultralytics"
      - module: cv2
        label: "opencv-python"
        install_hint: "pip install opencv-python"
      - module: yaml
        label: "PyYAML"
        install_hint: "pip install pyyaml"

    optional:
      - module: faiss
        label: "FAISS (vector search)"
        install_hint: "pip install faiss-cpu"
        reason: "Required for vector similarity search; in-memory fallback used in dev"
      - module: psycopg2
        label: "psycopg2 (postgres)"
        install_hint: "pip install psycopg2-binary"
        reason: "Required for persistent storage; in-memory mode used when POSTGRES_DSN unset"
      - module: sqlalchemy
        label: "SQLAlchemy"
        install_hint: "pip install sqlalchemy"
        reason: "ORM for postgres; not required if POSTGRES_DSN unset"
      - module: asyncpg
        label: "asyncpg"
        install_hint: "pip install asyncpg"
        reason: "Async postgres driver; not required if POSTGRES_DSN unset"
      - module: insightface
        label: "InsightFace (face recognition)"
        install_hint: "pip install insightface"
        reason: "Face embedding extraction; feature disabled without this package"
      - module: torchreid.reid.utils
        label: "osnet/torchreid (re-ID)"
        install_hint: "pip install torchreid (Python 3.10 or earlier recommended)"
        reason: "Person re-identification embeddings; feature disabled without this package"

    required_if_env:
      - env_var: POSTGRES_DSN
        module: psycopg2
        label: "psycopg2 (POSTGRES_DSN is set)"
      - env_var: POSTGRES_DSN
        module: sqlalchemy
        label: "SQLAlchemy (POSTGRES_DSN is set)"
      - env_var: POSTGRES_DSN
        module: asyncpg
        label: "asyncpg (POSTGRES_DSN is set)"

  production:
    required:
      - module: torch
        label: "PyTorch"
        install_hint: "pip install torch --index-url https://download.pytorch.org/whl/cu124"
      - module: torchvision
        label: "torchvision"
        install_hint: "pip install torchvision --index-url https://download.pytorch.org/whl/cu124"
      - module: ultralytics
        label: "Ultralytics YOLO"
        install_hint: "pip install ultralytics"
      - module: cv2
        label: "opencv-python"
        install_hint: "pip install opencv-python"
      - module: yaml
        label: "PyYAML"
        install_hint: "pip install pyyaml"
      - module: faiss
        label: "FAISS (vector search)"
        install_hint: "pip install faiss-cpu  # or faiss-gpu"
      - module: psycopg2
        label: "psycopg2 (postgres)"
        install_hint: "pip install psycopg2-binary"
      - module: sqlalchemy
        label: "SQLAlchemy"
        install_hint: "pip install sqlalchemy"
      - module: asyncpg
        label: "asyncpg"
        install_hint: "pip install asyncpg"

    optional:
      - module: insightface
        label: "InsightFace (face recognition)"
        install_hint: "pip install insightface"
        reason: "Face embedding extraction; face recognition feature disabled without this"
      - module: torchreid.reid.utils
        label: "osnet/torchreid (re-ID)"
        install_hint: "pip install torchreid"
        reason: "Person re-ID embeddings; re-ID feature disabled without this"

    required_if_env: []

feature_dependencies:
  anomaly_video_model:
    label: "Video anomaly model (pretrained)"
    modules:
      - module: torch
        install_hint: "pip install torch --index-url https://download.pytorch.org/whl/cu124"
      - module: torchvision
        install_hint: "pip install torchvision --index-url https://download.pytorch.org/whl/cu124"
      - module: transformers
        install_hint: "pip install transformers"
    config_path: "configs/runtime/anomaly.yaml"
    enabled_path: "anomaly.video_model.enabled"
    development_behavior: "warn when anomaly video model is enabled and deps/weights are missing"
    production_behavior: "fail when anomaly video model is enabled and deps/weights are missing"

  anomaly_clip_decoding:
    label: "Video clip decoding for anomaly"
    modules:
      - module: decord
        install_hint: "pip install decord"
      - module: av
        install_hint: "pip install av"
    config_path: "configs/runtime/anomaly.yaml"
    enabled_path: "anomaly.video_model.enabled"
    development_behavior: "warn when clip decoding deps are missing"
    production_behavior: "fail when anomaly video model is enabled and clip decoding deps are missing"

  segmentation:
    label: "SAM2 segmentation"
    module: sam2
    install_hint: "pip install git+https://github.com/facebookresearch/sam2.git"
    config_path: "configs/runtime/segmentation.yaml"
    enabled_path: "segmentation.enabled"
    provider_path: "segmentation.provider"
    checkpoint_path: "models/segmentation/sam2/checkpoint.pt"
    model_config: "configs/segmentation/sam2.yaml"
    development_behavior: "warn when segmentation is enabled and SAM2/checkpoint/config are missing"
    production_behavior: "fail when segmentation is enabled and SAM2/checkpoint/config are missing"

  identity_face:
    label: "Identity face provider"
    modules:
      - module: insightface
        install_hint: "pip install insightface"
      - module: onnxruntime
        install_hint: "pip install onnxruntime-gpu"
    config_path: "configs/runtime/identity.yaml"
    enabled_path: "identity.face.enabled"
    development_behavior: "warn when face identity is enabled and provider deps are missing unless fail_open=false"
    production_behavior: "fail when face identity is enabled and provider deps are missing"

  identity_reid:
    label: "Identity ReID provider"
    modules:
      - module: torch
        install_hint: "pip install torch --index-url https://download.pytorch.org/whl/cu124"
      - module: torchreid.reid.utils
        install_hint: "pip install torchreid"
    config_path: "configs/runtime/identity.yaml"
    enabled_path: "identity.reid.enabled"
    development_behavior: "warn when ReID is enabled and deps are missing if fail_open=true"
    production_behavior: "fail when ReID is enabled and deps are missing"

  identity_liveness:
    label: "Identity liveness provider"
    modules: []
    config_path: "configs/runtime/identity.yaml"
    enabled_path: "identity.liveness.enabled"
    provider_path: "identity.liveness.provider"
    development_behavior: "warn when liveness is enabled because provider integration is pending"
    production_behavior: "fail when liveness is enabled until a real provider is installed"
