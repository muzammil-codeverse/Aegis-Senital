# Phase 25/26 — Model Evaluation & Benchmarking Configuration
# Phase 26 adds real inference wiring, mAP@0.5:0.95, confidence threshold sweeps,
# model candidate head-to-head benchmarking, and the model selection policy engine.

evaluation:
  output_dir: "storage/evaluation_runs"
  fail_on_missing_required_dataset: true
  device: "cuda"
  allow_cpu_fallback: true
  save_failure_cases: true
  save_config_snapshot: true
  latency_test_input: "samples/videos/test_stream.mp4"
  latency_duration_seconds: 120

# Regression policy for comparison reports
regression_policy:
  detection_map_drop_warn: 0.02
  detection_map_drop_fail: 0.05
  latency_p95_increase_warn_percent: 15
  latency_p95_increase_fail_percent: 30
  false_positive_increase_warn_percent: 20

# Phase 26 — inference safety (no silent downloads, warmup, image size)
inference:
  allow_weight_downloads: false
  fail_on_missing_required_model: true
  default_image_size: 640
  warmup_runs: 5
  benchmark_runs: 1

# Phase 26 — model candidates for head-to-head benchmarking
# Set required: true for models that must exist; required: false for optional candidates.
# Paths must be set per deployment — do NOT commit real paths to version control.
# Phase 26B — `configs/evaluation/evaluation.local.yaml` is auto-merged when present
# for machine-specific dataset overrides.
model_candidates:
  weapon:
    - name: weapon_yolov8_baseline
      backend: ultralytics_yolo
      path: "models/weapon/model.pt"
      required: true
      task: detection
      classes:
        - pistol
        - rifle
        - knife
        - grenade
        - shotgun

    - name: weapon_yolo11_candidate
      backend: ultralytics_yolo
      path: "models/weapon/yolo11_best.pt"
      required: false
      task: detection
      classes:
        - pistol
        - rifle
        - knife
        - grenade
        - shotgun

  phone:
    - name: phone_yolov8_baseline
      backend: ultralytics_yolo
      path: "models/phone/model.pt"
      required: true
      task: detection
      classes:
        - phone

    - name: phone_yolo11_candidate
      backend: ultralytics_yolo
      path: "models/phone/yolo11_best.pt"
      required: false
      task: detection
      classes:
        - phone

# Phase 26 — confidence threshold sweep for detection models
detection_threshold_sweep:
  enabled: true
  thresholds: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.50, 0.60, 0.70]

# Phase 26 — model selection policy
# Used by the recommendation engine to select the best detector per task.
# Thresholds are deployment targets, not evaluation minimums.
model_selection_policy:
  min_map_50: 0.70
  min_recall: 0.65
  max_fp_per_image: 0.25
  max_p95_latency_ms: 50
  max_gpu_memory_mb: 3000
  prefer_recall_for_weapon: true
  prefer_precision_for_phone: false

# Baseline models (legacy-compatible aliases retained for older tooling)
models:
  weapon_yolov8_baseline:
    path: "models/weapon/model.pt"
    task: detection
    backend: ultralytics_yolo
    version: "v1"
    class_names: ["pistol", "rifle", "knife", "grenade", "shotgun"]
  phone_yolov8_baseline:
    path: "models/phone/model.pt"
    task: detection
    backend: ultralytics_yolo
    version: "v1"
    class_names: ["phone"]
  weapon_yolo:
    path: "models/weapon/model.pt"
    task: detection
    backend: ultralytics_yolo
    version: "v1"
    class_names: ["pistol", "rifle", "knife", "grenade", "shotgun"]
  phone_yolo:
    path: "models/phone/model.pt"
    task: detection
    backend: ultralytics_yolo
    version: "v1"
    class_names: ["phone"]
  weapon_yolo11_candidate:
    path: "models/weapon/yolo11_best.pt"
    task: detection
    backend: ultralytics_yolo
    version: null
    class_names: ["pistol", "rifle", "knife", "grenade", "shotgun"]
  phone_yolo11_candidate:
    path: "models/phone/yolo11_best.pt"
    task: detection
    backend: ultralytics_yolo
    version: null
    class_names: ["phone"]
  insightface:
    path: ""
    task: face
    version: null
  osnet_reid:
    path: ""
    task: reid
    version: null
  grounding_dino:
    path: ""
    task: open_vocab
    version: null

# Detection benchmark datasets. Machine-specific path overrides belong in
# configs/evaluation/evaluation.local.yaml when local dataset directories differ.
datasets:
  weapon_eval:
    task: detection
    type: coco_yolo
    images_dir: "datasets/evaluation/weapon/images"
    labels_dir: "datasets/evaluation/weapon/labels"
    class_names:
      - pistol
      - rifle
      - knife
      - grenade
      - shotgun
    required: true
  phone_eval:
    task: detection
    type: coco_yolo
    images_dir: "datasets/evaluation/phone/images"
    labels_dir: "datasets/evaluation/phone/labels"
    class_names:
      - phone
    required: true

# Open-vocab evaluation prompts
open_vocab_eval:
  prompts:
    - prompt_id: weapon_visible
      text: "visible weapon"
      threshold: 0.35
    - prompt_id: firearm
      text: "firearm"
      threshold: 0.35
    - prompt_id: knife
      text: "knife"
      threshold: 0.30
    - prompt_id: unattended_bag
      text: "unattended bag or backpack"
      threshold: 0.38
    - prompt_id: masked_person
      text: "masked person"
      threshold: 0.40
