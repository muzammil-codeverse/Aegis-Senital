[pytest]
addopts = --basetemp=storage/pytest_basetemp
testpaths =
    tests
    pipeline_test.py
python_files =
    test_*.py
    *_test.py
    pipeline_test.py
norecursedirs =
    .git
    .github
    .pytest_cache
    .venv
    venv
    env
    node_modules
    __pycache__
    dist
    build
    datasets
    logs
    models
    runs
    runtime_state
    storage
